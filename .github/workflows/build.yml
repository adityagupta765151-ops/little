name: windows build

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", "launcher_web.py", "jarvis/app/config.py", "requirements*.txt", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller packaging/little.spec --noconfirm
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}"; else echo "VERSION=0.1.0"; fi >> "$GITHUB_ENV"
      - run: iscc /DAppVersion=${{ env.VERSION }} packaging\little.iss
      - uses: actions/upload-artifact@v4
        with:
          name: LittleSetup
          path: dist/LittleSetup-*.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LittleSetup-*.exe
